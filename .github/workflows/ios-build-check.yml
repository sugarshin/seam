name: ios-build-check

# `iOS build (unsigned, no archive)` は main の ruleset で必須チェック。
# workflow 単位の `paths:` で絞ると対象外の PR ではチェック自体が報告されず
# PR が BLOCKED のまま止まるため、workflow は毎回起動し、native に影響する
# ファイルが無ければ job を skip する (skip は必須チェック上 success 扱い)。
on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ios-build-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect native-affecting changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      native: ${{ steps.filter.outputs.native }}

    steps:
      - name: Filter changed files
        id: filter
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          cat > native-paths.txt <<'EOF'
          packages/app/package.json
          packages/app/app.json
          packages/app/scripts/stripPushEntitlement.mjs
          pnpm-lock.yaml
          .npmrc
          .github/workflows/ios-build-check.yml
          EOF
          gh api --paginate "repos/$REPO/pulls/$PR_NUMBER/files" \
            --jq '.[] | .filename, (.previous_filename // empty)' > changed-files.txt
          if grep -qxF -f native-paths.txt changed-files.txt; then
            native=true
          else
            native=false
          fi
          echo "native=$native" >> "$GITHUB_OUTPUT"
          echo "native=$native"
          grep -xF -f native-paths.txt changed-files.txt || true

  ios-build:
    name: iOS build (unsigned, no archive)
    needs: changes
    # 判定 job 自体が失敗した場合もビルドを走らせる (skip させると必須チェックを素通りしてしまう)。
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.native == 'true') }}
    runs-on: macos-26
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
        with:
          xcode-version: '26.2'

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          run_install: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm

      - uses: ruby/setup-ruby@26e5b7d197ebf60545ee9667bcbace0be11ccaec # v1.334.0
        with:
          ruby-version: '3.4.9'
          bundler-cache: false

      - name: Install JS deps
        run: pnpm install --frozen-lockfile

      - name: Expo prebuild
        working-directory: packages/app
        run: pnpm exec expo prebuild --platform ios --clean --no-install

      - name: Strip push entitlement
        working-directory: packages/app
        run: node scripts/stripPushEntitlement.mjs

      - name: Cache Pods
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            packages/app/ios/Pods
            ~/Library/Caches/CocoaPods
          key: ${{ runner.os }}-pods-${{ hashFiles('pnpm-lock.yaml', 'packages/app/package.json', 'packages/app/app.json') }}
          restore-keys: |
            ${{ runner.os }}-pods-

      - name: Pod install
        working-directory: packages/app/ios
        env:
          RCT_NEW_ARCH_ENABLED: '1'
          USE_HERMES: '1'
        run: pod install --repo-update

      - name: Cache Xcode DerivedData
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/Library/Developer/Xcode/DerivedData
          key: ${{ runner.os }}-xcode-${{ hashFiles('packages/app/ios/Podfile.lock') }}
          restore-keys: |
            ${{ runner.os }}-xcode-

      - name: Build (unsigned, no archive)
        working-directory: packages/app/ios
        run: |
          set -euo pipefail
          xcodebuild \
            -workspace Seam.xcworkspace \
            -scheme Seam \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            ENABLE_BITCODE=NO \
            build
